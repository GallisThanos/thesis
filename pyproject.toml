[project]
name = "thesis"
version = "0.1.0"
description = "Music mix feature analysis and listening-study questionnaire dashboards"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.35,<2", "pandas>=2,<3", "numpy>=1.26,<3",
  "scipy>=1.12,<2", "altair>=5,<6", "matplotlib>=3.8,<4",
  "librosa>=0.10.2,<0.12", "pyloudnorm>=0.2.0,<0.3",
  "google-generativeai>=0.8,<0.9",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pre-commit>=4,<5", "pip-audit>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_extraction", "src/questionnaire_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
